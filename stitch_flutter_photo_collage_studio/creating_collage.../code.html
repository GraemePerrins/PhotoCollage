<!-- Micro-interaction Script -->
<script>
        // Simulate progress increment
        let progress = 65;
        const progressBar = document.querySelector('.bg-gradient-to-r');
        const progressText = document.querySelector('.font-display-lg');
        
        setInterval(() => {
            if(progress < 99) {
                progress += Math.random() * 0.5;
                progressBar.style.width = `${progress}%`;
                progressText.innerText = `Processing images... ${Math.floor(progress)}%`;
            }
        }, 1000);
    </script>
